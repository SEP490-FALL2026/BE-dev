name: Backend CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'prisma/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.windsurfrules'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'rules-check.config.json'
      - '.prettierrc'
      - '.prettierignore'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'prisma/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.windsurfrules'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'rules-check.config.json'
      - '.prettierrc'
      - '.prettierignore'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for rules
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check rules graph and regression fixtures
        run: |
          node scripts/check-rules.mjs
          node --test scripts/check-rules.test.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local quality gate
        run: pnpm check

      - name: Run API E2E tests
        run: pnpm test:e2e

      - name: Verify OpenAPI export
        run: |
          pnpm openapi:export
          git diff --exit-code -- openapi.json

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
